services:
  - type: web
    name: rrt-rangel-ai-trial
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
